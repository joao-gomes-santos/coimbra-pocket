<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Coimbra Pocket: Instant survival map for tourists in Coimbra, Portugal. Toilets, water, shade, lockers, and uphill elevators.">
  <title>Coimbra Pocket — City Survival Map</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Leaflet CSS (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header Overlay -->
  <header class="top-bar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Coimbra Pocket</h1>
    </div>

    <div class="top-controls">
      <button id="nearest-btn" class="pill-btn accent-pill" aria-label="Find nearest point">
        <span data-i18n="nearestBtn">Nearest</span>
      </button>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Theme">
        <svg id="theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="theme-icon-sun" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <button id="lang-toggle" class="pill-btn" aria-label="Switch language">EN | PT</button>
    </div>
  </header>

  <!-- Full-Screen Map Container -->
  <main id="map" role="region" aria-label="Interactive survival map of Coimbra"></main>

  <!-- Floating Locate Me Button -->
  <button id="locate-btn" class="fab-locate" aria-label="Locate me">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2">
      <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
    </svg>
    <span data-i18n="locateMe">Locate Me</span>
  </button>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Bottom Thumb-Zone Filter Dock -->
  <nav class="filter-dock" aria-label="Quick categories">
    <div class="filter-scroll" id="filter-bar">
      <button class="filter-chip active" data-category="all">
        <span class="chip-icon">🧭</span>
        <span data-i18n="catAll">All</span>
      </button>
      <button class="filter-chip" data-category="wc">
        <span class="chip-icon">🚻</span>
        <span data-i18n="catWc">WC / Toilets</span>
      </button>
      <button class="filter-chip" data-category="water">
        <span class="chip-icon">💧</span>
        <span data-i18n="catWater">Water</span>
      </button>
      <button class="filter-chip" data-category="rest">
        <span class="chip-icon">🌳</span>
        <span data-i18n="catRest">Rest &amp; Shade</span>
      </button>
      <button class="filter-chip" data-category="lockers">
        <span class="chip-icon">🧳</span>
        <span data-i18n="catLockers">Lockers</span>
      </button>
      <button class="filter-chip" data-category="uphill">
        <span class="chip-icon">🛗</span>
        <span data-i18n="catUphill">Uphill Help</span>
      </button>
    </div>

    <!-- Discreet Monetization / Partner Slot (Toggle visibility in app.js CONFIG) -->
    <div id="monetization-bar" class="monetization-slot">
      <span class="ad-badge" data-i18n="partnerBadge">TIP</span>
      <a id="partner-link" href="#lockers" target="_blank" rel="noopener noreferrer" data-i18n="partnerText">
        Hands-free Coimbra: Book city-center luggage storage from €3.50/day →
      </a>
    </div>
  </nav>

  <!-- Bottom Sheet Detail Card -->
  <section id="detail-sheet" class="bottom-sheet hidden" aria-modal="true" role="dialog">
    <div class="sheet-handle-area" id="sheet-close-area">
      <div class="sheet-handle"></div>
    </div>

    <div class="sheet-content">
      <div class="sheet-header">
        <div class="sheet-badges">
          <span id="sheet-category" class="badge badge-cat">WC</span>
          <span id="sheet-access" class="badge badge-free">Free</span>
        </div>
        <button id="sheet-close-btn" class="close-circle" aria-label="Close details">✕</button>
      </div>

      <h2 id="sheet-title" class="sheet-title">Location Name</h2>

      <div class="sheet-meta">
        <span id="sheet-distance" class="distance-pill">📍 Enable GPS for distance</span>
        <span id="sheet-hours" class="hours-text">08:00 – 20:00</span>
      </div>

      <p id="sheet-note" class="sheet-note">Practical insider instructions appear here.</p>

      <div class="sheet-actions">
        <a id="sheet-directions" href="#" target="_blank" rel="noopener noreferrer" class="primary-cta">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M9 18l6-6-6-6"></path>
          </svg>
          <span data-i18n="directionsBtn">Directions (Walk)</span>
        </a>

        <a id="sheet-affiliate" href="#" target="_blank" rel="noopener noreferrer" class="secondary-cta hidden">
          <span data-i18n="bookBtn">Book Slot</span>
        </a>
      </div>

      <div class="sheet-footer">
        <a id="sheet-report" href="#" target="_blank" rel="noopener noreferrer" class="report-link" data-i18n="reportIssue">
          Report error / Out of order
        </a>
      </div>
    </div>
  </section>

  <!-- Leaflet JS (CDN) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- App Logic -->
  <script src="app.js"></script>
</body>
</html>
